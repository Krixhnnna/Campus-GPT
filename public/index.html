<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus GPT | LPU Smart Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
    <div class="app-wrapper">
        <header>
            <div class="brand-section">
                <div class="logo-circle">L</div>
                <div class="brand-text">
                    <h1>Campus GPT</h1>
                    <p>Lovely Professional University</p>
                </div>
            </div>
            <div class="header-actions">
                <div class="status-indicator">
                    <div class="status-dot"></div>
                    <span class="status-text">Online</span>
                </div>
                <button 
                    id="recent-btn"
                    class="header-btn secondary"
                >
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    <span>Recent</span>
                </button>
                <button 
                    id="new-chat-btn"
                    class="header-btn primary"
                    title="Start a new conversation"
                >
                    <span>New Chat</span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>
            </div>
        </header>

        <div class="chat-container" id="chat-container">
            <!-- Messages will be injected here -->
        </div>

        <form class="input-section" id="chat-form">
            <div class="input-wrapper">
                <input
                    type="text"
                    id="chat-input"
                    placeholder="Ask anything about LPU..."
                    autocomplete="off"
                />
                <button 
                    type="button" 
                    id="mic-button"
                    class="mic-button"
                    title="Start voice prompt"
                >
                    <svg id="mic-icon-inactive" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                    <svg id="mic-icon-active" style="display: none;" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="6" height="6"></rect>
                        <circle cx="12" cy="12" r="10"></circle>
                    </svg>
                </button>
                <button type="submit" id="send-button" class="send-button" disabled>
                    <svg
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </form>
    </div>
    
    <div id="history-overlay" class="history-overlay"></div>
    <div id="history-drawer" class="history-drawer">
        <div class="drawer-header">
            <h3>Recent Chats</h3>
            <button id="close-history" class="close-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div id="history-list" class="history-list">
            <div class="empty-history">No recent chats yet</div>
        </div>
    </div>

    <script src="script.js?v=2"></script>
</body>
</html>
