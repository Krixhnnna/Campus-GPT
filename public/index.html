<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus GPT | LPU Smart Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        const bgs = ['/lpu-bg.jpg', '/lpu-bg-2.jpg'];
        const bg = bgs[Math.floor(Math.random() * bgs.length)];
        document.documentElement.style.setProperty('--random-bg', "url('" + bg + "')");
    </script>
</head>
<body>
    <div class="app-wrapper">
        <header>
            <div class="brand-section">
                <div class="logo-circle">L</div>
                <div class="brand-text">
                    <h1>Campus GPT</h1>
                    <p>Lovely Professional University</p>
                </div>
            </div>
            <div style="display: flex; align-items: center; gap: 20px;">
                <div class="status-indicator">
                    <div class="status-dot"></div>
                    <span>Online</span>
                </div>
                <button 
                    id="clear-btn"
                    style="background: rgba(0,0,0,0.05); border: none; padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; cursor: pointer; font-weight: 600; color: var(--text-muted); transition: all 0.2s;"
                    onmouseover="this.style.background='rgba(0,0,0,0.1)'"
                    onmouseout="this.style.background='rgba(0,0,0,0.05)'"
                >
                    Clear
                </button>
            </div>
        </header>

        <div class="chat-container" id="chat-container">
            <!-- Messages will be injected here -->
        </div>

        <form class="input-section" id="chat-form">
            <div class="input-wrapper">
                <input
                    type="text"
                    id="chat-input"
                    placeholder="Ask anything about LPU..."
                    autocomplete="off"
                />
                <button 
                    type="button" 
                    id="mic-button"
                    class="mic-button"
                    title="Start voice prompt"
                >
                    <svg id="mic-icon-inactive" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                    <svg id="mic-icon-active" style="display: none;" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="6" height="6"></rect>
                        <circle cx="12" cy="12" r="10"></circle>
                    </svg>
                </button>
                <button type="submit" id="send-button" class="send-button" disabled>
                    <svg
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </form>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
